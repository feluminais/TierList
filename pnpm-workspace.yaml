packages:
  - "apps/*"
  - "packages/*"
  - "services/*"

# Keeps native-module paths short for the Android build, not a preference.
#
# pnpm's default isolated layout nests every package under a path like
#   node_modules/.pnpm/@shopify+react-native-skia@<version>_<hash>/node_modules/...
# and the Android CMake builds of native modules produce object paths deeper
# still. On Windows the ninja bundled with the SDK's default CMake cannot handle
# paths past 260 characters, and fails with "manifest 'build.ninja' still dirty
# after 100 tries". Hoisting flattens node_modules to an npm-style layout and
# takes that nesting out of every path.
#
# Necessary, not sufficient: from the long path of a git worktree the build
# still fails. See "Android: the native build" in docs/superpowers/BACKLOG.md.
#
# Cost: weaker protection against phantom dependencies, since hoisting makes
# undeclared packages resolvable. The `overrides` block below is what keeps
# versions single, so that protection does not depend on the linker.
nodeLinker: hoisted

overrides:
  # Expo SDK 57 pins these exactly, and a tested matrix is the whole point of
  # an SDK release. Next.js accepts any React 19.x and apps/web never runs
  # React Native (it aliases to react-native-web), so the flexible side adapts
  # to the rigid one. These overrides also cover *transitive* resolutions --
  # notably @shopify/react-native-skia's peer on react-native -- so a second
  # copy of React or React Native cannot re-enter the graph and produce the
  # "Invalid hook call" / blank-canvas failure that looks like a Skia bug.
  # Keep in lockstep with apps/mobile/package.json when bumping the SDK.
  react: 19.2.3
  react-dom: 19.2.3
  react-native: 0.86.0
  "@shopify/react-native-skia": 2.6.2
  # Security floors for transitive dependencies. Each stays inside the major
  # version its dependents already request, so no dependent sees an API change;
  # each is a floor rather than a pin, so later patches still resolve.
  "nanoid@>=3.0.0 <3.3.18": ^3.3.18
  "js-yaml@>=4.0.0 <4.3.2": ^4.3.2
  "@xmldom/xmldom@>=0.8.0 <0.8.15": ^0.8.15
  "@xmldom/xmldom@>=0.9.0 <0.9.12": ^0.9.12
  "shell-quote@>=1.8.4 <1.11.0": ^1.11.0
allowBuilds:
  # The first three resolve their native binary from prebuilt platform-specific
  # optional deps (@esbuild/*, @img/sharp-*, @unrs/resolver-binding-*), so no
  # postinstall is needed to obtain it. Each denial is workspace-wide and applies
  # to future *direct* dependents (e.g. services/api). For cross-platform deploys
  # use supportedArchitectures, not this flag.
  #
  # The prebuilt @esbuild/<platform> binary is already present; the postinstall
  # only creates the standalone `esbuild` CLI shim, which vite/vitest never invoke
  # (they use the JS API). A future package shelling out to the esbuild CLI would
  # need this flipped to true.
  esbuild: false
  # install/check.js only opts into a *source* build when a system libvips is
  # present; denying it pins us to prebuilts.
  sharp: false
  # napi-postinstall repairs a missing binding by downloading a tarball at install
  # time; denying it keeps installs hermetic.
  unrs-resolver: false
  # UNLIKE the three entries above, this postinstall is REQUIRED. Do not
  # pattern-match it to them: there the prebuilt binary is already in place and
  # the script is redundant, so denying it costs nothing. Here the binary ships in
  # a *sibling* package and the script is the only thing that puts it where the
  # build looks. scripts/install-libs.js is a pure local fs.cpSync -- no network,
  # no downloads, no child_process -- that copies prebuilt binaries out of
  # react-native-skia-android and react-native-skia-apple-{ios,macos,tvos} into
  # the package's own libs/, which is exactly the path android/build.gradle reads
  # (skiaLibsPath = "${projectDir}/../libs/android"). Denying it breaks the Android
  # native build.
  '@shopify/react-native-skia': true
patchedDependencies:
  '@shopify/react-native-skia@2.6.2': patches/@shopify__react-native-skia@2.6.2.patch
