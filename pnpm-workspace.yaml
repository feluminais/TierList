packages:
  - "apps/*"
  - "packages/*"
  - "services/*"
allowBuilds:
  # All three resolve their native binary from prebuilt platform-specific
  # optional deps (@esbuild/*, @img/sharp-*, @unrs/resolver-binding-*). No
  # postinstall is needed to obtain that binary:
  #   esbuild       the prebuilt @esbuild/<platform> binary is already present;
  #                 the postinstall only creates the standalone `esbuild` CLI
  #                 shim, which vite/vitest never invoke (they use the JS API).
  #                 A future package shelling out to the esbuild CLI would need
  #                 this flipped to true.
  #   sharp         install/check.js only opts into a *source* build when a
  #                 system libvips is present; denying it pins us to prebuilts.
  #   unrs-resolver napi-postinstall repairs a missing binding by downloading
  #                 a tarball at install time; denying it keeps installs hermetic.
  # NOTE: this denial is workspace-wide and applies to future *direct*
  # dependents (e.g. services/api). For cross-platform deploys use
  # supportedArchitectures, not this flag.
  esbuild: false
  sharp: false
  unrs-resolver: false
