# Typecheck, test and build on every push and pull request.
#
# Turborepo's cache is not restored between runs here, so every task runs for
# real: a cache hit is not a test run.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # Installs the pnpm version named in package.json's `packageManager`.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Two tasks at a time. Every package's tests start their own worker pool,
      # and a small runner running all of them at once can exceed the pools'
      # shutdown timeout after the tests themselves have passed.
      - name: Typecheck and test
        run: pnpm exec turbo typecheck test --concurrency=2

      - name: Lint the web app
        run: pnpm --filter web lint

      - name: Build the web app
        run: pnpm --filter web build

      # Fails only on critical advisories in what ships; lower severities are
      # reviewed, not gated, because some sit inside Expo's build tooling and
      # wait on an SDK release.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=critical
